# Compilazione di ElettroLab per Windows.
# Ad ogni push su main (e su richiesta manuale) esegue i test e produce:
#  - ElettroLab-portable.zip  → cartella da copiare su chiavetta, con portable.txt
#  - ElettroLab-installer     → installer NSIS (.exe), anche silenzioso con /S
# Gli artefatti si scaricano dalla pagina "Actions" del repository; a ogni
# push su main gli stessi file vengono pubblicati anche nella release
# «ultima-versione» (pagina Releases), con link diretti che non richiedono
# di accedere a GitHub:
#   https://github.com/cecconce/ELETROLAB/releases/latest/download/ElettroLab-portable.zip
#   https://github.com/cecconce/ELETROLAB/releases/latest/download/ElettroLab-installer.exe
name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Una sola build alla volta per ramo: le build superate vengono annullate.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Serve per spostare il tag e aggiornare la release «ultima-versione».
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Rust (stabile)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache di Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Installa le dipendenze
        run: npm ci

      - name: Test dei motori e dell'interfaccia
        run: npm test

      - name: Test della parte nativa (cartella dati, file)
        working-directory: src-tauri
        run: cargo test

      - name: Compila l'app (Tauri + NSIS)
        run: npx tauri build

      - name: Prepara la versione portable
        shell: pwsh
        run: |
          $dest = "ElettroLab-portable"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "src-tauri/target/release/elettrolab.exe" "$dest/ElettroLab.exe"
          Copy-Item "LICENSE" "$dest/LICENSE.txt"
          Copy-Item "LICENZE.txt" "$dest/LICENZE.txt"
          # La presenza di portable.txt attiva la modalità portable:
          # impostazioni e progetti vengono salvati in .\dati\ accanto all'exe.
          Set-Content -Encoding utf8 -Path "$dest/portable.txt" -Value @(
            "ElettroLab - modalita' portable.",
            "Finche' questo file resta accanto a ElettroLab.exe, i dati vengono salvati nella cartella 'dati' qui accanto.",
            "Cancellalo per usare invece la cartella utente (%APPDATA%\ElettroLab)."
          )
          Compress-Archive -Path "$dest/*" -DestinationPath "ElettroLab-portable.zip" -Force

      - name: Carica la versione portable
        uses: actions/upload-artifact@v4
        with:
          name: ElettroLab-portable
          path: ElettroLab-portable.zip
          if-no-files-found: error

      - name: Carica l'installer
        uses: actions/upload-artifact@v4
        with:
          name: ElettroLab-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # --- Release «ultima-versione» (solo push su main) --------------------
      # Il download degli artefatti passa da un server di Microsoft che spesso
      # le reti delle scuole bloccano; i file di una release si scaricano
      # invece da github.com con un link fisso.
      - name: Pubblica nella release «ultima-versione»
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=ultima-versione
          # Installer con un nome fisso, così il link non cambia a ogni versione.
          cp src-tauri/target/release/bundle/nsis/*.exe ElettroLab-installer.exe
          # Il tag segue sempre l'ultimo commit compilato.
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          BREVE="${GITHUB_SHA:0:7}"
          DATA="$(date -u +%d/%m/%Y)"
          cat > note.md <<NOTE
          Versione compilata il $DATA dal commit $BREVE (ultima versione di \`main\`, test superati).

          **ElettroLab-portable.zip** (consigliata nei laboratori): estrarre lo zip in una cartella o su una chiavetta e avviare \`ElettroLab.exe\`. Non servono permessi di amministratore; i dati restano nella cartella \`dati\` accanto all'exe.

          **ElettroLab-installer.exe**: installazione nel profilo dell'utente; per il tecnico è disponibile anche l'installazione silenziosa con \`/S\`.

          Le novità di ogni fase sono descritte in STATO.md.
          NOTE
          sed -i 's/^          //' note.md
          TITOLO="ElettroLab – ultima versione ($DATA, $BREVE)"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITOLO" --notes-file note.md --latest
          else
            gh release create "$TAG" --title "$TITOLO" --notes-file note.md --latest
          fi
          gh release upload "$TAG" ElettroLab-portable.zip ElettroLab-installer.exe --clobber
