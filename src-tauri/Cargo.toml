[package]
name = "elettrolab"
version = "0.1.0"
description = "ElettroLab - simulatore didattico"
authors = ["Pierluigi Ceccon"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "elettrolab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Eseguibile piccolo per PC datati.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
